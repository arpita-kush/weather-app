<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-app">
        <h1> Weather App</h1>
        <button id="themeBtn">🌙 Dark Mode</button>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
            <button id="locationBtn">📍 Use my Location</button>
        </div>
        <div class="weather-info">

            <h2 id="cityName">City Name</h2>
            <p id="country">Country</p>
            <p id="localTime">Local Time</p>
            <p id="temperature">--°C</p>
            <img id="weatherIcon" src="" alt="Weather Icon">
            <p id="condition">Weather Condition</p>
            <p id="loading">Loading...</p>
            <p id="errorMessage"> </p>
            <p>Feels like: <span id="feelsLike">--</span></p>
            <div class="weather-details">
                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--</h3>
                </div>
                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind</p>
                    <h3 id="wind">--</h3>
                </div>
                
            </div>
            <div class="forecast-section">
                    <h2>3-Day Forecast</h2>
                    <div id="forecastContainer"></div>
                </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
